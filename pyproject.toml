[project]
name = "ai-screenshot-assistant"
version = "0.2.71"
description = "Windows and macOS AI screenshot assistant with DeepSeek/OpenRouter failover, mobile streaming, and black/flicker/transparent/content-loss capture repair."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
